<style>
@import url('https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=IBM+Plex+Sans+JP:wght@400;500;600;700&family=Space+Mono:wght@700&display=swap');

:root{
  --ink:#1B2430;
  --paper:#F1EFE9;
  --panel:#FFFFFF;
  --line:#DCD7CC;
  --amber:#F2A93B;
  --amber-deep:#C9821A;
  --steel:#3E6B8A;
  --green:#2F8F5B;
  --red:#C6473C;
  --muted:#6B7280;
  --radius:14px;
}
*{box-sizing:border-box;}
body{
  margin:0;
  background:var(--paper);
  background-image:linear-gradient(var(--line) 1px, transparent 1px), linear-gradient(90deg, var(--line) 1px, transparent 1px);
  background-size:28px 28px;
  color:var(--ink);
  font-family:'IBM Plex Sans JP', -apple-system, 'Hiragino Sans', sans-serif;
}
header{
  display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:14px;
  padding:16px 24px;background:var(--ink);color:#fff;
}
.brand{display:flex;align-items:baseline;gap:10px;}
.brand .mark{font-family:'Barlow Condensed';font-weight:700;font-size:15px;letter-spacing:.18em;background:var(--amber);color:var(--ink);padding:3px 8px;border-radius:4px;}
.brand h1{font-size:19px;font-weight:600;margin:0;}
.controls{display:flex;align-items:center;gap:12px;flex-wrap:wrap;}
.controls label{font-size:12px;color:#B9C2CE;}
.controls select{padding:8px 10px;border-radius:6px;border:1px solid #46505E;background:#232D3B;color:#fff;font-family:'Space Mono',monospace;font-size:13px;}
.controls select option{color:#000;}
.clock{font-family:'Space Mono',monospace;font-size:15px;color:var(--amber);}
.updated{font-size:11px;color:#9AA5B1;}

main{padding:22px;max-width:1600px;margin:0 auto;}

#groupSections{display:grid;grid-template-columns:repeat(auto-fit,minmax(460px,1fr));gap:20px;align-items:start;}

.group-section{
  background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);
  padding:20px;
}
.group-section h2{font-size:18px;margin:0 0 14px;}

.qty-summary-compact{
  background:var(--ink);color:#fff;border-radius:8px;padding:9px 12px;margin:0 0 14px;
  display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;font-size:12px;
}
.qsc-total{font-family:'Space Mono',monospace;font-weight:700;color:var(--amber);font-size:14px;flex-shrink:0;}
.qsc-breakdown{color:#D7DCE2;}
.progress-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:14px;margin-bottom:20px;}
.bin-card{background:#F7F5F0;border:1px solid var(--line);border-radius:10px;padding:16px;}
.bin-card h3{margin:0 0 10px;font-size:16px;}
.bin-progress-bar{height:9px;background:#EEEAE1;border-radius:5px;overflow:hidden;margin-bottom:12px;}
.bin-progress-fill{height:100%;background:var(--amber);transition:width .3s;}
.bin-stats{display:flex;gap:8px;}
.bin-stat{flex:1;text-align:center;background:#fff;border-radius:8px;padding:8px 4px;}
.bin-stat .n{font-family:'Space Mono',monospace;font-size:16px;font-weight:700;}
.bin-stat .l{font-size:10px;color:var(--muted);margin-top:2px;}

.sub-block{margin-bottom:18px;}
.sub-block:last-child{margin-bottom:0;}
.sub-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;}
.sub-head h4{font-size:13px;margin:0;color:var(--steel);font-weight:700;text-transform:uppercase;letter-spacing:.04em;}
.sub-count{font-family:'Space Mono',monospace;font-size:15px;font-weight:700;color:var(--amber-deep);}

.sub-details{border:1px solid var(--line);border-radius:10px;padding:0 14px;margin-bottom:14px;background:#FCFBF8;}
.sub-details:last-child{margin-bottom:0;}
.sub-details > summary{
  list-style:none;cursor:pointer;padding:12px 0;display:flex;align-items:center;justify-content:space-between;
}
.sub-details > summary::-webkit-details-marker{display:none;}
.sub-details > summary::before{content:'▸';display:inline-block;margin-right:8px;color:var(--muted);transition:transform .15s;}
.sub-details[open] > summary::before{transform:rotate(90deg);}
.sub-details > summary h4{display:inline;}
.sub-details .sub-body{padding:0 0 14px;}

.working-list{display:flex;flex-direction:column;gap:6px;}
.wk-row{display:flex;align-items:center;gap:12px;padding:8px 10px;border-radius:8px;background:#F7F5F0;}
.wk-avatar{
  width:30px;height:30px;border-radius:50%;background:var(--ink);color:var(--amber);
  display:flex;align-items:center;justify-content:center;font-weight:700;font-size:11px;flex-shrink:0;
  font-family:'Space Mono',monospace;
}
.wk-info{flex:1;min-width:0;}
.wk-name{font-size:13px;font-weight:600;}
.wk-meta{font-size:11px;color:var(--muted);margin-top:1px;}
.wk-timer{font-family:'Space Mono',monospace;font-size:13px;font-weight:700;color:var(--steel);flex-shrink:0;}
.working-empty{padding:14px;text-align:center;color:var(--muted);font-size:12px;background:#F7F5F0;border-radius:8px;}

table.perf{width:100%;border-collapse:collapse;font-size:13px;}
table.perf th{text-align:right;font-size:11px;color:var(--muted);font-weight:600;padding:6px 8px;border-bottom:2px solid var(--ink);cursor:pointer;user-select:none;white-space:nowrap;}
table.perf th.name-col{text-align:left;}
table.perf th .sort-arrow{display:inline-block;width:10px;font-size:9px;color:var(--amber-deep);}
table.perf td{text-align:right;padding:7px 8px;border-bottom:1px solid var(--line);font-family:'Space Mono',monospace;}
table.perf td.name-col{text-align:left;font-family:'IBM Plex Sans JP';font-weight:600;}
table.perf tbody tr{cursor:pointer;}
table.perf tbody tr:hover td{background:#F7F5F0;}

.wd-log{width:100%;border-collapse:collapse;font-size:13px;}
.wd-log th{text-align:right;font-size:11px;color:var(--muted);font-weight:600;padding:6px 8px;border-bottom:2px solid var(--ink);}
.wd-log th.name-col{text-align:left;}
.wd-log td{text-align:right;padding:7px 8px;border-bottom:1px solid var(--line);font-family:'Space Mono',monospace;}
.wd-log td.name-col{text-align:left;font-family:'IBM Plex Sans JP';}
.wd-summary{display:flex;gap:8px;margin-bottom:14px;}
.wd-summary .bin-stat{flex:1;}

.empty-msg{padding:20px;color:var(--muted);font-size:13px;}

.sub-head .manage-btn{
  background:var(--steel);color:#fff;border:none;padding:6px 12px;border-radius:6px;

<script>
const SUPABASE_URL = 'https://nhkbfzzysonkqqgmvaao.supabase.co';
const SUPABASE_KEY = 'sb_publishable_4_LZAPz9gceWwdgT_OGHYQ_EWX4DWvT';
const SB_HEADERS = { 'apikey': SUPABASE_KEY, 'Authorization': 'Bearer ' + SUPABASE_KEY, 'Content-Type': 'application/json' };
const $ = id => document.getElementById(id);

async function sbSelect(table, query=''){
  try{
    const res = await fetch(`${SUPABASE_URL}/rest/v1/${table}?${query}`, {headers: SB_HEADERS});
    if(!res.ok) return null;
    return await res.json();
  }catch(e){ console.error(e); return null; }
}
async function sbDelete(table, query){
  try{
    const res = await fetch(`${SUPABASE_URL}/rest/v1/${table}?${query}`, {method:'DELETE', headers: SB_HEADERS});
    return res.ok;
  }catch(e){ console.error(e); return false; }
}

let confirmCb = null;
function showConfirm(text, cb){
  $('confirmText').textContent = text;
  confirmCb = cb;
  $('confirmOverlay').classList.add('show');
}
$('confirmYes').addEventListener('click', ()=>{
  $('confirmOverlay').classList.remove('show');
  if(confirmCb) confirmCb();
  confirmCb = null;
});
$('confirmNo').addEventListener('click', ()=>{
  $('confirmOverlay').classList.remove('show');
  confirmCb = null;
});
function localGet(key){ try{ const v = localStorage.getItem(key); return v?JSON.parse(v):null; }catch(e){ return null; } }
function localSet(key, value){ try{ localStorage.setItem(key, JSON.stringify(value)); }catch(e){} }

function todayKey(){
  const d = new Date();
  const pad = n=>String(n).padStart(2,'0');
  return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
}
function fmtTimeShort(iso){
  const d = new Date(iso);
  const pad = n=>String(n).padStart(2,'0');
  return `${pad(d.getHours())}:${pad(d.getMinutes())}`;
}
function fmtDuration(sec){
  sec = Math.max(0, Math.round(sec));
  const h = Math.floor(sec/3600), m = Math.floor((sec%3600)/60), s = sec%60;
  const pad = n=>String(n).padStart(2,'0');
  return h>0 ? `${h}:${pad(m)}:${pad(s)}` : `${m}:${pad(s)}`;
}
function esc(s){ return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
const WEEKDAY_JA = ['日','月','火','水','木','金','土'];
function todayWeekdayJa(){ return WEEKDAY_JA[new Date().getDay()]; }

// ---------- bin math (mirrors the main kiosk app) ----------
function detectBins(courseNumbers){
  const uniq = [...new Set(courseNumbers)].sort((a,b)=>a-b);
  if(uniq.length <= 1) return [{label:'全体', min:uniq[0]||0, max:uniq[0]||0}];
  const gaps = [];
  for(let i=1;i<uniq.length;i++) gaps.push({idx:i, gap:uniq[i]-uniq[i-1]});
  const maxGapEntry = gaps.reduce((a,b)=> b.gap>a.gap?b:a, gaps[0]);
  const avgGap = gaps.reduce((s,g)=>s+g.gap,0)/gaps.length;
  if(maxGapEntry.gap > avgGap*3 && maxGapEntry.gap > 5){
    const splitIdx = maxGapEntry.idx;
    return [
      {label:'1便', min:uniq[0], max:uniq[splitIdx-1]},
      {label:'2便', min:uniq[splitIdx], max:uniq[uniq.length-1]}
    ];
  }
  return [{label:'全体', min:uniq[0], max:uniq[uniq.length-1]}];
}
function detectBinsFromCourseTable(courseNumbers, courseBinMap){
  const uniq = [...new Set(courseNumbers)];
  if(uniq.length === 0) return null;
  if(uniq.some(c => courseBinMap[c] === undefined)) return null;
  const byBin = {};
  uniq.forEach(c=>{
    const b = courseBinMap[c];
    if(!byBin[b]) byBin[b] = new Set();
    byBin[b].add(c);
  });
  return Object.keys(byBin).map(Number).sort((a,b)=>a-b).map(b => ({label: b+'便', courseSet: byBin[b]}));
}
function computeBinData(bin, planEntries, doneEntries, openSessions, now){
  const inBin = e => bin.courseSet ? bin.courseSet.has(e.courseNo) : (e.courseNo >= bin.min && e.courseNo <= bin.max);
  const plan = planEntries.filter(inBin);
  const done = doneEntries.filter(inBin);
  const openInBin = openSessions.filter(inBin);

  const volumeTotal = plan.reduce((s,e)=>s+e.lots, 0);
  const doneKeys = new Set(done.map(e => e.courseNo+'-'+e.storeNo));
  const volumeDone = done.reduce((s,e)=>s+e.count, 0);

  const courseNos = [...new Set(plan.map(e=>e.courseNo))];
  let courseDone = 0;
  courseNos.forEach(c=>{
    const stores = plan.filter(e=>e.courseNo===c).map(e=>e.storeNo);
    if(stores.length && stores.every(s => doneKeys.has(c+'-'+s))) courseDone++;
  });

  const startTimes = [...done.map(e=>new Date(e.startISO).getTime()), ...openInBin.map(e=>new Date(e.startISO).getTime())];
  const started = startTimes.length > 0;
  const binStart = started ? new Date(Math.min(...startTimes)) : null;

  return {label: bin.label, courseDone, courseTotal: courseNos.length, volumeTotal, volumeDone,
          remaining: volumeTotal - volumeDone, started, binStart, done};
}
function currentProductivityFor(data, expectedProd, now){
  if(!data.started) return expectedProd;
  const windowStart = new Date(Math.max(data.binStart.getTime(), now.getTime() - 45*60000));
  const windowDone = data.done.filter(e => new Date(e.endISO).getTime() >= windowStart.getTime());
  const vol = windowDone.reduce((s,e)=>s+e.count, 0);
  const elapsedH = Math.max((now.getTime() - windowStart.getTime())/3600000, 1/3600);
  return vol > 0 ? vol/elapsedH : expectedProd;
}
function computeEndTime(data, currentProd, prevBinEnd, expectedProd, expectedBreak, now){
  if(data.volumeTotal > 0 && data.remaining <= 0){
    const endTimes = data.done.map(e=>new Date(e.endISO).getTime());
    return {time: new Date(Math.max(...endTimes)), actual:true};
  }
  if(data.started){
    const hoursLeft = currentProd > 0 ? data.remaining/currentProd : 0;
    return {time: new Date(now.getTime() + hoursLeft*3600000), actual:false};
  }
  if(prevBinEnd){
    const assumedStart = new Date(prevBinEnd.getTime() + expectedBreak*60000);
    const hoursLeft = expectedProd > 0 ? data.volumeTotal/expectedProd : 0;
    return {time: new Date(assumedStart.getTime() + hoursLeft*3600000), actual:false};
  }
  return null;
}
function renderRangeSummary(rangeRows){
  if(!rangeRows || rangeRows.length === 0) return '';
  const total = rangeRows.reduce((s,r)=>s+r.lots, 0);
  const breakdown = rangeRows.map(r=>`${esc(r.name)} ${r.lots}`).join(' ／ ');
  return `<div class="qty-summary-compact">
    <span class="qsc-total">合計 ${total}</span>
    <span class="qsc-breakdown">${breakdown}</span>
  </div>`;
}
function renderBinCards(results){
  return `<div class="progress-grid">` + results.map(r=>{
    const cPct = r.courseTotal ? Math.round(r.courseDone/r.courseTotal*100) : 0;
    const vPct = r.volumeTotal ? Math.round(r.volumeDone/r.volumeTotal*100) : 0;
    const endLabel = r.endResult ? (fmtTimeShort(r.endResult.time.toISOString()) + (r.endResult.actual?'(実績)':'')) : '--:--';
    return `
    <div class="bin-card">
      <h3>${esc(r.label)}</h3>
      <div class="bin-progress-bar"><div class="bin-progress-fill" style="width:${vPct}%"></div></div>
      <div class="bin-stats">
        <div class="bin-stat"><div class="n">${r.courseDone}/${r.courseTotal}</div><div class="l">コース進捗(${cPct}%)</div></div>
        <div class="bin-stat"><div class="n">${Math.round(r.volumeDone)}/${Math.round(r.volumeTotal)}</div><div class="l">物量進捗(${vPct}%)</div></div>
        <div class="bin-stat"><div class="n">${endLabel}</div><div class="l">終了予測</div></div>
      </div>
      <div style="font-size:12px;color:var(--muted);margin-top:10px;">${r.started ? `開始 ${fmtTimeShort(r.binStart.toISOString())} ・ 現在の生産性 約${Math.round(r.prod)}個/人時` : '未開始(想定生産性で予測)'}</div>
    </div>`;
  }).join('') + `</div>`;
}

// ---------- data loading ----------
let LAST = { siteCode:null, groups: [], ordersByGroup: {}, logs: [], sessions: [], courseBinMap: {} };
async function loadSiteOptions(){
  const rows = await sbSelect('work_groups', 'select=site_code');
  const sites = [...new Set((rows||[]).map(r=>r.site_code))].sort();
  const sel = $('siteSelect');
  sel.innerHTML = sites.map(s=>`<option value="${s}">${s}</option>`).join('');
  const saved = localGet('dash_site_code');
  if(saved && sites.includes(saved)) sel.value = saved;
  else if(sites.length) sel.value = sites[0];
}

async function refresh(){
  const siteCode = $('siteSelect').value;
  if(!siteCode) return;
  localSet('dash_site_code', siteCode);

  const wd = todayWeekdayJa();
  const dateKey = todayKey();
  const dayStart = dateKey + 'T00:00:00';
  const dayEnd = dateKey + 'T23:59:59.999';

  const [groups, courseRows, orderRows, logRows, sessionRows, rangeSummaryRows] = await Promise.all([
    sbSelect('work_groups', `site_code=eq.${encodeURIComponent(siteCode)}&order=name.asc`),
    sbSelect('course_master', `site_code=eq.${encodeURIComponent(siteCode)}&weekday=eq.${encodeURIComponent(wd)}`),
    sbSelect('orders', `site_code=eq.${encodeURIComponent(siteCode)}&work_date=eq.${dateKey}`),
    sbSelect('work_log', `site_code=eq.${encodeURIComponent(siteCode)}&start_at=gte.${dayStart}&start_at=lte.${dayEnd}&cancelled=eq.false`),
    sbSelect('active_sessions', `site_code=eq.${encodeURIComponent(siteCode)}`),
    sbSelect('order_range_summary', `site_code=eq.${encodeURIComponent(siteCode)}&work_date=eq.${dateKey}`)
  ]);

  const courseBinMap = {};
  (courseRows||[]).forEach(r=> courseBinMap[r.course_no] = r.bin);

  const sessions = (sessionRows||[]).map(r=>({
    no: r.worker_no, name: r.worker_name, groupId: r.group_id, groupName: r.group_name,
    courseNo: r.course_no, courseName: r.course_name, storeNo: r.store_no, count: r.count, startISO: r.start_at
  }));

  const logs = (logRows||[]).map(r=>({
    no: r.worker_no, name: r.worker_name, groupId: r.group_id, courseNo: r.course_no, courseName: r.course_name, storeNo: r.store_no,
    count: r.count, startISO: r.start_at, endISO: r.end_at
  }));

  const ordersByGroup = {};
  (orderRows||[]).forEach(r=>{
    if(!ordersByGroup[r.group_id]) ordersByGroup[r.group_id] = [];
    ordersByGroup[r.group_id].push({courseNo: r.course_no, storeNo: r.store_no, lots: r.lots});
  });

  const rangeSummaryByGroup = {};
  (rangeSummaryRows||[]).forEach(r=>{
    if(!rangeSummaryByGroup[r.group_id]) rangeSummaryByGroup[r.group_id] = [];
    rangeSummaryByGroup[r.group_id].push({name: r.range_name, lots: r.lots});
  });

  LAST = { siteCode, groups: groups||[], ordersByGroup, logs, sessions, courseBinMap, rangeSummaryByGroup };

  const now = new Date();
  const sectionsHtml = (groups||[]).map(g=>{
    const planEntries = ordersByGroup[g.id] || [];
    const doneEntries = logs.filter(l => l.groupId === g.id);
    const openInGroup = sessions.filter(s => s.groupId === g.id);

    const rangeSummaryHtml = renderRangeSummary(rangeSummaryByGroup[g.id]);

    let progressHtml = '<div class="empty-msg">本日の受注データが未取込です。</div>';
    if(planEntries.length > 0){
      const bins = detectBinsFromCourseTable(planEntries.map(e=>e.courseNo), courseBinMap) || detectBins(planEntries.map(e=>e.courseNo));
      let prevEnd = null;
      const results = bins.map(bin=>{
        const data = computeBinData(bin, planEntries, doneEntries, openInGroup, now);
        const prod = currentProductivityFor(data, g.expected_productivity||300, now);
        const endResult = computeEndTime(data, prod, prevEnd, g.expected_productivity||300, g.expected_break_minutes||60, now);
        prevEnd = endResult ? endResult.time : prevEnd;
        return {...data, prod, endResult};
      });
      progressHtml = renderBinCards(results);
    }

    const workersHtml = renderGroupWorkers(openInGroup);
    const perfHtml = renderGroupPerformanceTable(g.id, doneEntries);

    return `<div class="group-section">
      <h2>${esc(g.name)}</h2>
      ${rangeSummaryHtml}
      <div class="sub-block">${progressHtml}</div>
      <details class="sub-details" data-detail-key="${g.id}:workers">
        <summary><h4>現在の作業者</h4><div class="sub-count">${openInGroup.length}人</div></summary>
        <div class="sub-body">${workersHtml}</div>
      </details>
      <details class="sub-details" data-detail-key="${g.id}:perf">
        <summary><h4>本日の個人成績</h4><div class="sub-count">${new Set(doneEntries.map(l=>l.no)).size}人</div></summary>
        <div class="sub-body" id="perfBody-${g.id}">${perfHtml}</div>
      </details>
      <div class="sub-block">
        <div class="sub-head"><h4>受注データ</h4><button class="manage-btn" data-group="${g.id}">受注データ確認</button></div>
      </div>
    </div>`;
  }).join('');

  const openDetailKeys = new Set();
  $('groupSections').querySelectorAll('details.sub-details[open]').forEach(d=>{
    openDetailKeys.add(d.getAttribute('data-detail-key'));
  });

  $('groupSections').innerHTML = sectionsHtml || '<div class="empty-msg">この拠点にはまだ作業グループがありません。</div>';
  $('groupSections').querySelectorAll('.manage-btn').forEach(btn=>{
    btn.addEventListener('click', ()=> openOrderManage(btn.getAttribute('data-group')));
  });
  $('groupSections').querySelectorAll('details.sub-details').forEach(d=>{
    if(openDetailKeys.has(d.getAttribute('data-detail-key'))) d.open = true;
  });
  (groups||[]).forEach(g => attachPerfHandlers(g.id));
  $('updatedText').textContent = '最終更新: ' + fmtTimeShort(now.toISOString());
  if($('orderManageOverlay').classList.contains('show')) renderOrderManageList();
}

function renderGroupWorkers(openInGroup){
  if(openInGroup.length === 0) return '<div class="working-empty">現在作業中の担当者はいません</div>';
  const sorted = [...openInGroup].sort((a,b)=> new Date(a.startISO)-new Date(b.startISO));
  return `<div class="working-list">` + sorted.map(s=>{
    const elapsed = (Date.now() - new Date(s.startISO).getTime())/1000;
    return `<div class="wk-row">
      <div class="wk-avatar">${s.no}</div>
      <div class="wk-info">
        <div class="wk-name">${esc(s.name)}</div>
        <div class="wk-meta">${esc(s.courseName)} / 店${s.storeNo} ・ ${s.count}個口</div>
      </div>
      <div class="wk-timer" data-start="${s.startISO}">${fmtDuration(elapsed)}</div>
    </div>`;
  }).join('') + `</div>`;
}

const PERF_SORT = {}; // groupId -> {key, dir}
const PERF_COLS = [
  {key:'name', label:'氏名', cls:'name-col'},
  {key:'stores', label:'店舗数'},
  {key:'count', label:'数量'},
  {key:'productivity', label:'生産性/h'}
];

function computePerfPeople(doneEntries){
  const byWorker = {};
  doneEntries.forEach(l=>{
    if(!byWorker[l.no]) byWorker[l.no] = {no:l.no, name:l.name, storeKeys:new Set(), count:0, seconds:0};
    byWorker[l.no].storeKeys.add(l.courseNo+'-'+l.storeNo);
    byWorker[l.no].count += l.count;
    byWorker[l.no].seconds += Math.max(0, (new Date(l.endISO) - new Date(l.startISO))/1000);
  });
  return Object.values(byWorker).map(w=>{
    const minutes = w.seconds/60;
    const productivity = minutes>0 ? Math.round(w.count*60/minutes) : 0;
    return { no:w.no, name:w.name, stores:w.storeKeys.size, count:w.count, productivity };
  });
}

function renderGroupPerformanceTable(groupId, doneEntries){
  if(doneEntries.length === 0) return '<div class="working-empty">本日の完了実績はまだありません</div>';
  if(!PERF_SORT[groupId]) PERF_SORT[groupId] = {key:'productivity', dir:'desc'};
  const {key, dir} = PERF_SORT[groupId];
  let people = computePerfPeople(doneEntries);
  people.sort((a,b)=>{
    let r;
    if(key === 'name') r = String(a.name).localeCompare(String(b.name), 'ja');
    else r = a[key] - b[key];
    return dir === 'asc' ? r : -r;
  });

  const theadHtml = PERF_COLS.map(c=>{
    const arrow = c.key === key ? (dir==='asc' ? '▲' : '▼') : '';
    return `<th class="${c.cls||''}" data-sortkey="${c.key}">${c.label}<span class="sort-arrow">${arrow}</span></th>`;
  }).join('');

  return `<table class="perf" data-group="${groupId}">
    <thead><tr>${theadHtml}</tr></thead>
    <tbody>${people.map(p=>`
      <tr data-worker="${p.no}" data-name="${esc(p.name)}"><td class="name-col">${esc(p.name)} <span style="color:var(--muted);font-size:11px;">(№${p.no})</span></td><td>${p.stores}</td><td>${p.count}</td><td>${p.productivity}</td></tr>
    `).join('')}</tbody>
  </table>`;
}

function attachPerfHandlers(groupId){
  const body = $('perfBody-' + groupId);
  if(!body) return;
  body.querySelectorAll('th[data-sortkey]').forEach(th=>{
    th.addEventListener('click', ()=>{
      const key = th.getAttribute('data-sortkey');
      const cur = PERF_SORT[groupId] || {key:'productivity', dir:'desc'};
      if(cur.key === key){ cur.dir = cur.dir === 'asc' ? 'desc' : 'asc'; }
      else { PERF_SORT[groupId] = {key, dir: key==='name' ? 'asc' : 'desc'}; }
      refreshPerfTable(groupId);
    });
  });
  body.querySelectorAll('tbody tr[data-worker]').forEach(tr=>{
    tr.addEventListener('click', ()=>{
      openWorkerDetail(groupId, tr.getAttribute('data-worker'), tr.getAttribute('data-name'));
    });
  });
}

function refreshPerfTable(groupId){
  const body = $('perfBody-' + groupId);
  if(!body) return;
  const doneEntries = LAST.logs.filter(l => l.groupId === groupId);
  body.innerHTML = renderGroupPerformanceTable(groupId, doneEntries);
  attachPerfHandlers(groupId);
}

// ---------- 個人明細モーダル(本日の個人成績から氏名クリックで表示) ----------
function openWorkerDetail(groupId, workerNo, workerName){
  const entries = LAST.logs
    .filter(l => l.groupId === groupId && String(l.no) === String(workerNo))
    .sort((a,b)=> new Date(a.startISO) - new Date(b.startISO));

  $('workerDetailTitle').textContent = `個人明細 ・ ${workerName} (№${workerNo})`;

  const totalCount = entries.reduce((s,e)=>s+e.count, 0);
  const totalSeconds = entries.reduce((s,e)=> s + Math.max(0,(new Date(e.endISO)-new Date(e.startISO))/1000), 0);
  const productivity = totalSeconds>0 ? Math.round(totalCount*3600/totalSeconds) : 0;
  $('workerDetailSummary').innerHTML = `<div class="wd-summary">
    <div class="bin-stat"><div class="n">${entries.length}</div><div class="l">完了店数</div></div>
    <div class="bin-stat"><div class="n">${totalCount}</div><div class="l">数量</div></div>
    <div class="bin-stat"><div class="n">${productivity}</div><div class="l">生産性/h</div></div>
  </div>`;

  if(entries.length === 0){
    $('workerDetailList').innerHTML = '<div class="empty-msg">本日の完了実績はありません</div>';
  } else {
    $('workerDetailList').innerHTML = `<table class="wd-log">
      <thead><tr><th class="name-col">コース－店</th><th>個口数</th><th>開始</th><th>終了</th><th>所要</th></tr></thead>
      <tbody>${entries.map(e=>{
        const dur = Math.max(0,(new Date(e.endISO)-new Date(e.startISO))/1000);
        return `<tr>
          <td class="name-col">${esc(e.courseName||('コース'+e.courseNo))} － ${e.storeNo}</td>
          <td>${e.count}</td>
          <td>${fmtTimeShort(e.startISO)}</td>
          <td>${fmtTimeShort(e.endISO)}</td>
          <td>${fmtDuration(dur)}</td>
        </tr>`;
      }).join('')}</tbody>
    </table>`;
  }
  $('workerDetailOverlay').classList.add('show');
}
$('workerDetailClose').addEventListener('click', ()=> $('workerDetailOverlay').classList.remove('show'));

function tickTimers(){
  document.querySelectorAll('.wk-timer').forEach(el=>{
    const start = new Date(el.getAttribute('data-start')).getTime();
    el.textContent = fmtDuration((Date.now()-start)/1000);
  });
}
function tickClock(){
  const d = new Date();
  const pad = n=>String(n).padStart(2,'0');
  $('clock').textContent = `${pad(d.getHours())}:${pad(d.getMinutes())}:${pad(d.getSeconds())}`;
}

// ---------- 受注データ確認(店単位・コース単位・便単位で、残っている予定を削除) ----------
let manageGroupId = null;

function busyKeysForGroup(groupId){
  const keys = new Set();
  LAST.logs.forEach(l=>{ if(l.groupId === groupId) keys.add(l.courseNo+'-'+l.storeNo); });
  LAST.sessions.forEach(s=>{ if(s.groupId === groupId) keys.add(s.courseNo+'-'+s.storeNo); });
  return keys;
}

function openOrderManage(groupId){
  manageGroupId = groupId;
  const g = (LAST.groups||[]).find(x=>x.id===groupId);
  $('orderManageTitle').textContent = '受注データ確認' + (g ? ` ・ ${g.name}` : '');
  $('orderManageFilter').value = '';
  renderOrderManageList();
  $('orderManageOverlay').classList.add('show');
}
$('orderManageClose').addEventListener('click', ()=> $('orderManageOverlay').classList.remove('show'));
$('orderManageFilter').addEventListener('input', renderOrderManageList);

function renderOrderManageList(){
  const list = $('orderManageList');
  const binBar = $('orderManageBinBar');
  const g = (LAST.groups||[]).find(x=>x.id===manageGroupId);
  const orderEntries = LAST.ordersByGroup[manageGroupId] || [];
  if(!g || orderEntries.length === 0){
    list.innerHTML = '<div class="empty-msg">本日の受注データがまだありません</div>';
    binBar.style.display = 'none'; binBar.innerHTML = '';
    return;
  }
  const filterText = $('orderManageFilter').value.trim();
  const busy = busyKeysForGroup(manageGroupId);
  const remaining = orderEntries.filter(e => !busy.has(e.courseNo+'-'+e.storeNo));

  // 便(1便/2便)一括削除バー
  const binsPresent = [...new Set(remaining.map(e => LAST.courseBinMap[e.courseNo]).filter(b => b !== undefined))].sort((a,b)=>a-b);
  if(binsPresent.length > 1){
    binBar.style.display = 'flex';
    binBar.innerHTML = binsPresent.map(b =>
      `<button class="bin-hide-btn" data-bin="${b}">${b}便の残りを削除</button>`).join('');
    binBar.querySelectorAll('.bin-hide-btn').forEach(btn=>{
      btn.addEventListener('click', ()=>{
        const bin = parseInt(btn.getAttribute('data-bin'), 10);
        const targets = remaining.filter(e => LAST.courseBinMap[e.courseNo] === bin);
        const courseCount = new Set(targets.map(e=>e.courseNo)).size;
        if(targets.length === 0) return;
        showConfirm(`${bin}便の残り予定(${courseCount}コース・${targets.length}店)をまとめて削除します。完了済みの店には影響しません。この操作は元に戻せません。よろしいですか？`, ()=>{
          deleteOrderEntries(targets);
        });
      });
    });
  } else {
    binBar.style.display = 'none';
    binBar.innerHTML = '';
  }

  const byCourse = {};
  orderEntries.forEach(e=>{
    if(!byCourse[e.courseNo]) byCourse[e.courseNo] = {courseNo: e.courseNo, done: 0, remainingItems: []};
    if(busy.has(e.courseNo+'-'+e.storeNo)) byCourse[e.courseNo].done += 1;
    else byCourse[e.courseNo].remainingItems.push(e);
  });
  let courses = Object.values(byCourse).sort((a,b)=> a.courseNo-b.courseNo);
  if(filterText) courses = courses.filter(c => String(c.courseNo).includes(filterText));
  if(courses.length === 0){
    list.innerHTML = '<div class="empty-msg">該当するコースがありません</div>';
    return;
  }

  list.innerHTML = courses.map(c => {
    const remainCount = c.remainingItems.length;
    const doneNote = c.done > 0 ? `<span class="psg-count">(完了${c.done}件は対象外)</span>` : '';
    const courseDelBtn = remainCount > 0
      ? `<button class="psi-del psg-del" data-course="${c.courseNo}" title="このコースの残りをすべて削除">🗑 コース削除</button>`
      : '';
    const storeRows = c.remainingItems
      .sort((a,b)=> a.storeNo - b.storeNo)
      .map(e => `
      <div class="pick-store-item" data-course="${e.courseNo}" data-store="${e.storeNo}">
        <div class="psi-code">${e.courseNo} － ${e.storeNo}</div>
        <div class="psi-lots">${e.lots}個口予定</div>
        <button class="psi-del" data-course="${e.courseNo}" data-store="${e.storeNo}" title="この店を削除">🗑</button>
      </div>`).join('');
    return `
      <div class="psg-head">
        <span class="psg-course">コース${c.courseNo}<span class="psg-count">残り${remainCount}店</span>${doneNote}</span>
        ${courseDelBtn}
      </div>
      ${storeRows || '<div class="empty-msg" style="padding:10px;">残っている店はありません(すべて完了)</div>'}
    `;
  }).join('');

  list.querySelectorAll('.psi-del:not(.psg-del)').forEach(btn=>{
    btn.addEventListener('click', (ev)=>{
      ev.stopPropagation();
      const courseNo = parseInt(btn.getAttribute('data-course'), 10);
      const storeNo = parseInt(btn.getAttribute('data-store'), 10);
      showConfirm(`コース${courseNo} － 店${storeNo} の予定を削除します。実績には影響しません。この操作は元に戻せません。よろしいですか？`, ()=>{
        deleteOrderEntries([{courseNo, storeNo}]);
      });
    });
  });
  list.querySelectorAll('.psg-del').forEach(btn=>{
    btn.addEventListener('click', (ev)=>{
      ev.stopPropagation();
      const courseNo = parseInt(btn.getAttribute('data-course'), 10);
      const targets = byCourse[courseNo].remainingItems;
      showConfirm(`コース${courseNo}の残り予定(${targets.length}店)をまとめて削除します。完了済みの店には影響しません。この操作は元に戻せません。よろしいですか？`, ()=>{
        deleteOrderEntries(targets);
      });
    });
  });
}

async function deleteOrderEntries(entries){
  const siteCode = LAST.siteCode;
  const groupId = manageGroupId;
  if(!siteCode || !groupId || entries.length === 0) return;
  const workDate = todayKey();
  await Promise.all(entries.map(e => sbDelete('orders',
    `site_code=eq.${encodeURIComponent(siteCode)}&work_date=eq.${workDate}&group_id=eq.${encodeURIComponent(groupId)}&course_no=eq.${e.courseNo}&store_no=eq.${e.storeNo}`
  )));
  await refresh();
  if($('orderManageOverlay').classList.contains('show')) renderOrderManageList();
}

$('siteSelect').addEventListener('change', refresh);

(async function init(){
  await loadSiteOptions();
  await refresh();
  tickClock();
  setInterval(tickClock, 1000);
  setInterval(tickTimers, 1000);
  setInterval(refresh, 15000);
})();
</script>
</body>
</html>
