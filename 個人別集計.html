<style>
@import url('https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=IBM+Plex+Sans+JP:wght@400;500;600;700&family=Space+Mono:wght@700&display=swap');

:root{
  --ink:#1B2430;
  --paper:#F1EFE9;
  --panel:#FFFFFF;
  --line:#DCD7CC;
  --amber:#F2A93B;
  --amber-deep:#C9821A;
  --steel:#3E6B8A;
  --green:#2F8F5B;
  --red:#C6473C;
  --muted:#6B7280;
  --radius:14px;
}
*{box-sizing:border-box;}
body{
  margin:0;
  background:var(--paper);
  background-image:linear-gradient(var(--line) 1px, transparent 1px), linear-gradient(90deg, var(--line) 1px, transparent 1px);
  background-size:28px 28px;
  color:var(--ink);
  font-family:'IBM Plex Sans JP', -apple-system, 'Hiragino Sans', sans-serif;
}
header{
  display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:14px;
  padding:16px 24px;background:var(--ink);color:#fff;
}
.brand{display:flex;align-items:baseline;gap:10px;}
.brand .mark{font-family:'Barlow Condensed';font-weight:700;font-size:15px;letter-spacing:.18em;background:var(--amber);color:var(--ink);padding:3px 8px;border-radius:4px;}
.brand h1{font-size:19px;font-weight:600;margin:0;}
.controls{display:flex;align-items:center;gap:10px;flex-wrap:wrap;}
.controls label{font-size:12px;color:#B9C2CE;}
.controls select, .controls input{
  padding:8px 10px;border-radius:6px;border:1px solid #46505E;background:#232D3B;color:#fff;
  font-family:'Space Mono',monospace;font-size:13px;
}
.controls select option{color:#000;}

main{padding:22px;max-width:1400px;margin:0 auto;}

.summary-bar{display:flex;gap:14px;flex-wrap:wrap;margin-bottom:18px;}
.summary-stat{
  background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px 18px;min-width:120px;
}
.summary-stat .n{font-family:'Space Mono',monospace;font-size:22px;font-weight:700;}
.summary-stat .l{font-size:11px;color:var(--muted);margin-top:2px;}

.sort-row{display:flex;align-items:center;gap:8px;margin-bottom:16px;flex-wrap:wrap;}
.sort-row .lbl{font-size:12px;color:var(--muted);font-weight:600;margin-right:4px;}
.sort-btn{
  background:#fff;border:1px solid var(--line);border-radius:20px;padding:7px 14px;font-size:13px;
  font-family:'IBM Plex Sans JP';cursor:pointer;color:var(--muted);font-weight:600;
}
.sort-btn.active{background:var(--ink);border-color:var(--ink);color:var(--amber);}

.period-presets{display:flex;flex-wrap:wrap;gap:6px;max-width:420px;}
.preset-btn{
  background:#232D3B;border:1px solid #46505E;border-radius:14px;padding:6px 12px;font-size:12px;
  font-family:'IBM Plex Sans JP';cursor:pointer;color:#B9C2CE;font-weight:600;white-space:nowrap;
}
.preset-btn.active{background:var(--amber);border-color:var(--amber);color:var(--ink);}
.period-range{display:flex;align-items:center;gap:6px;}
.period-range span{color:#B9C2CE;font-size:12px;}
.period-label{color:#F2A93B;font-size:11px;margin-top:4px;font-family:'Space Mono',monospace;}

.table-wrap{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);overflow:auto;}
table{border-collapse:collapse;width:100%;min-width:1100px;}
thead tr.group-row th{
  background:#F7F5F0;font-family:'Barlow Condensed';font-weight:700;font-size:13px;letter-spacing:.06em;
  color:var(--steel);text-align:center;padding:8px 6px;border-bottom:1px solid var(--line);border-left:2px solid var(--paper);
}
thead tr.col-row th{
  font-size:11px;color:var(--muted);font-weight:600;padding:6px;border-bottom:2px solid var(--ink);
  text-align:right;white-space:nowrap;
}
thead tr.col-row th.name-col{text-align:left;}
tbody td{padding:8px 6px;text-align:right;font-family:'Space Mono',monospace;font-size:13px;border-bottom:1px solid var(--line);white-space:nowrap;}
tbody td.name-col{text-align:left;font-family:'IBM Plex Sans JP';font-weight:600;font-size:13px;}
tbody tr:hover td{background:#FBF8F1;}
tbody tr:nth-child(1) td.total-prod{color:var(--amber-deep);font-weight:700;}
td.group-sep{border-left:2px solid var(--paper);}
td.total-col{background:#FCF7EC;}

.empty-msg{padding:60px 20px;text-align:center;color:var(--muted);}

tr.person-row{cursor:pointer;}
tr.person-row:hover td{background:#F3EEE0;}
tr.person-row.open td{background:#FBF3E2;}
tr.person-row .arrow{display:inline-block;width:12px;color:var(--steel);}
tr.detail-row td{background:#FCFBF8;padding:14px 18px;}

table.raw-table{width:100%;border-collapse:collapse;font-size:12px;}
table.raw-table th{text-align:left;color:var(--muted);font-weight:600;padding:5px 8px;border-bottom:1px solid var(--line);}
table.raw-table td{padding:6px 8px;border-bottom:1px solid var(--line);}
table.raw-table tr.cancelled td{color:var(--muted);text-decoration:line-through;}
table.raw-table input{padding:5px;border:1px solid var(--line);border-radius:5px;font-family:inherit;font-size:12px;width:100%;}

.mini-btn{background:var(--steel);color:#fff;border:none;padding:6px 12px;border-radius:6px;font-size:12px;font-weight:600;cursor:pointer;font-family:inherit;margin-right:6px;}
.mini-btn:active{background:#2F5670;}
.del-btn{background:none;border:1px solid var(--red);color:var(--red);border-radius:6px;padding:6px 12px;font-size:12px;cursor:pointer;font-family:inherit;}
.del-btn:active{background:#FBEAE8;}

.print-only{display:none;}

@media print{
  @page{ size: A3 portrait; margin: 10mm; }
  body{ background:#fff; }
  #appHeader, .controls, .sort-row{ display:none !important; }
  tr.detail-row{ display:none !important; }
  tr.person-row .arrow{ display:none; }
  .print-only{
    display:block; margin:0 0 10px; font-family:'IBM Plex Sans JP';
  }
  .print-only h2{ margin:0 0 3px; font-size:18px; }
  .print-only .meta{ font-size:12px; color:#444; }
  main{ padding:0; max-width:none; }
  .summary-bar{ margin-bottom:8px; gap:8px; }
  .summary-stat{ border:1px solid #ccc; padding:6px 12px; min-width:90px; }
  .summary-stat .n{ font-size:16px; }
  .summary-stat .l{ font-size:10px; }
  .table-wrap{ border:none; overflow:visible; }
  table{ min-width:0; width:100%; font-size:10.5px; }
  thead{ display:table-header-group; }
  thead tr.group-row th{ padding:4px 3px; font-size:11px; }
  thead tr.col-row th{ padding:3px; font-size:9px; }
  tbody td{ padding:3px; font-size:10.5px; }
  tbody tr{ break-inside:avoid; }
}
</style>
</head>
<body>
<header id="appHeader">
  <div class="brand"><span class="mark">WMS</span><h1>個人別集計</h1></div>
  <div class="controls">
    <div>
      <label>拠点コード</label><br>
      <select id="siteSelect"></select>
    </div>
    <div>
      <label>作業グループ</label><br>
      <select id="groupSelect"></select>
    </div>
    <div>
      <label>期間</label><br>
      <div class="period-presets" id="periodPresets">
        <button class="preset-btn" data-preset="today">今日</button>
        <button class="preset-btn" data-preset="yesterday">昨日</button>
        <button class="preset-btn" data-preset="thisWeek">今週</button>
        <button class="preset-btn" data-preset="lastWeek">先週</button>
        <button class="preset-btn" data-preset="thisMonth">今月</button>
        <button class="preset-btn" data-preset="lastMonth">先月</button>
        <button class="preset-btn" data-preset="thisYear">今年</button>
        <button class="preset-btn" data-preset="lastYear">去年</button>
      </div>
    </div>
    <div>
      <label>開始日〜終了日</label><br>
      <div class="period-range">
        <input type="date" id="startDateInput"><span>〜</span><input type="date" id="endDateInput">
      </div>
      <div class="period-label" id="periodLabel"></div>
    </div>
    <div>
      <label>&nbsp;</label><br>
      <button id="printBtn" style="padding:8px 14px;border-radius:6px;border:1px solid var(--amber);background:var(--amber);color:var(--ink);font-weight:700;font-family:inherit;font-size:13px;cursor:pointer;">🖨 印刷</button>
      <button id="csvBtn" style="padding:8px 14px;border-radius:6px;border:1px solid #46505E;background:#232D3B;color:#fff;font-weight:700;font-family:inherit;font-size:13px;cursor:pointer;">⬇ CSV</button>
      <button id="forceReloadBtn" onclick="location.href=location.pathname+'?_r='+Date.now();" title="最新版を強制的に読み込み直します" style="padding:8px 14px;border-radius:6px;border:1px solid #46505E;background:#232D3B;color:#fff;font-weight:700;font-family:inherit;font-size:13px;cursor:pointer;">⟳ 更新</button>
    </div>
  </div>
</header>

<div id="printHeading" class="print-only"></div>

<main>
  <div class="summary-bar" id="summaryBar"></div>
  <div class="sort-row" id="sortRow">
    <span class="lbl">並び替え(合計):</span>
    <button class="sort-btn" data-key="productivity">生産性</button>

function localSet(key, value){ try{ localStorage.setItem(key, JSON.stringify(value)); }catch(e){} }

const WEEKDAY_JA = ['日','月','火','水','木','金','土'];
function weekdayJaOf(dateStr){
  const [y,m,d] = dateStr.split('-').map(Number);
  return WEEKDAY_JA[new Date(y, m-1, d).getDay()];
}

// ---- JST基準の日付計算ヘルパー ----
// ブラウザのタイムゾーン設定に依存せず、常に日本時間で「今日」や週/月/年の境界を計算する。
// (以前、UTC基準で計算していたためJST 00:00〜09:00のレコードが欠落するバグがあったため、
//  同じ罠を週次・月次・年次でも踏まないよう、ここで一元管理する)
function jstTodayParts(){
  const now = new Date();
  const utcMs = now.getTime() + now.getTimezoneOffset()*60000;
  const jst = new Date(utcMs + 9*3600000);
  return { y: jst.getUTCFullYear(), m: jst.getUTCMonth()+1, d: jst.getUTCDate() };
}
function parseDateStrToParts(s){
  const [y,m,d] = s.split('-').map(Number);
  return { y, m, d };
}
function partsToStr(p){
  const pad = n=>String(n).padStart(2,'0');
  return `${p.y}-${pad(p.m)}-${pad(p.d)}`;
}
function addDaysToParts(p, days){
  const dt = new Date(Date.UTC(p.y, p.m-1, p.d));
  dt.setUTCDate(dt.getUTCDate()+days);
  return { y: dt.getUTCFullYear(), m: dt.getUTCMonth()+1, d: dt.getUTCDate() };
}
function weekdayIndexOfParts(p){
  // 0=日,1=月,...6=土 (UTCとして扱っているだけで、カレンダー上の日付計算なので問題ない)
  return new Date(Date.UTC(p.y, p.m-1, p.d)).getUTCDay();
}
function startOfWeekMonday(p){
  const dow = weekdayIndexOfParts(p); // 0=Sun
  const diff = dow === 0 ? 6 : dow - 1;
  return addDaysToParts(p, -diff);
}
function startOfMonth(p){ return { y:p.y, m:p.m, d:1 }; }
function endOfMonth(p){
  const dt = new Date(Date.UTC(p.y, p.m, 0)); // 次月0日 = 当月末日
  return { y: dt.getUTCFullYear(), m: dt.getUTCMonth()+1, d: dt.getUTCDate() };
}
function computePresetRange(name){
  const today = jstTodayParts();
  switch(name){
    case 'today': return { start: today, end: today };
    case 'yesterday': { const p = addDaysToParts(today, -1); return { start:p, end:p }; }
    case 'thisWeek': { const s = startOfWeekMonday(today); return { start:s, end: today }; }
    case 'lastWeek': { const s = addDaysToParts(startOfWeekMonday(today), -7); const e = addDaysToParts(s, 6); return { start:s, end:e }; }
    case 'thisMonth': { const s = startOfMonth(today); return { start:s, end: today }; }
    case 'lastMonth': { const lastOfPrev = addDaysToParts(startOfMonth(today), -1); const s = startOfMonth(lastOfPrev); return { start:s, end: lastOfPrev }; }
    case 'thisYear': { return { start: { y:today.y, m:1, d:1 }, end: today }; }
    case 'lastYear': { return { start: { y:today.y-1, m:1, d:1 }, end: { y:today.y-1, m:12, d:31 } }; }
    default: return { start: today, end: today };
  }
}
// クエリ用: JSTのカレンダー日付境界を正しいUTC ISO文字列に変換する
// (dateStr + 'T00:00:00' のようにタイムゾーンオフセットなしで渡すと
//  Supabase側でUTCと解釈され、JST 00:00〜09:00のデータが取得できなくなるため、
//  必ず '+09:00' を明示してからtoISOString()でUTCに変換する)
function jstRangeToUtcISO(startStr, endStr){
  const startISO = new Date(startStr + 'T00:00:00.000+09:00').toISOString();
  const endISO = new Date(endStr + 'T23:59:59.999+09:00').toISOString();
  return { startISO, endISO };
}
function weekdayJaOfTimestamp(iso){
  const utcMs = new Date(iso).getTime();
  const jst = new Date(utcMs + 9*3600000);
  return WEEKDAY_JA[jst.getUTCDay()];
}
function fmtDateShortJst(iso){
  const utcMs = new Date(iso).getTime();
  const jst = new Date(utcMs + 9*3600000);
  const pad = n=>String(n).padStart(2,'0');
  return `${pad(jst.getUTCMonth()+1)}/${pad(jst.getUTCDate())}`;
}
function fmtTimeShort(iso){
  const d = new Date(iso);
  const pad = n=>String(n).padStart(2,'0');
  return `${pad(d.getHours())}:${pad(d.getMinutes())}`;
}
function fmtDuration(sec){
  sec = Math.max(0, Math.round(sec));
  const h = Math.floor(sec/3600), m = Math.floor((sec%3600)/60), s = sec%60;
  const pad = n=>String(n).padStart(2,'0');
  return h>0 ? `${h}:${pad(m)}:${pad(s)}` : `${m}:${pad(s)}`;
}
function toLocalInput(iso){
  const d = new Date(iso);
  const pad = n=>String(n).padStart(2,'0');
  return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}T${pad(d.getHours())}:${pad(d.getMinutes())}`;
}

let sortKey = 'productivity';
let expandedPeople = new Set();
let editingRawId = null;
let rawLogsByWorker = {}; // worker_no -> array of raw work_log rows (all, including cancelled)
let lastGroupBinMap = {};
let lastPeople = [];

async function loadSiteOptions(){
  const rows = await sbSelect('work_groups', 'select=site_code');

async function loadGroupOptions(){
  const siteCode = $('siteSelect').value;
  const rows = await sbSelect('work_groups', `site_code=eq.${encodeURIComponent(siteCode)}&order=name.asc`);
  const sel = $('groupSelect');
  const groups = rows || [];
  sel.innerHTML = `<option value="__all__">全グループ</option>` + groups.map(g=>`<option value="${g.id}">${g.name}</option>`).join('');
  const saved = localGet('report_group_id_'+siteCode);
  if(saved && [...sel.options].some(o=>o.value===saved)) sel.value = saved;

async function loadCourseBinMap(siteCode){
  // 期間指定で複数の曜日にまたがるため、曜日ごとのマップとして全曜日分をまとめて取得する
  const rows = await sbSelect('course_master', `site_code=eq.${encodeURIComponent(siteCode)}`);
  const map = {}; // { [weekday]: { [course_no]: bin } }
  (rows||[]).forEach(r=>{
    if(!map[r.weekday]) map[r.weekday] = {};
    map[r.weekday][r.course_no] = r.bin;
  });
  return map;
}

function detectBinsHeuristic(courseNo, allCourseNos){
  // fallback when no course_master entry: just call everything bin 1
  return 1;
}

function getBinForRow(r, binMapByWeekday){
  const wd = weekdayJaOfTimestamp(r.start_at);
  const dayMap = (binMapByWeekday && binMapByWeekday[wd]) || {};
  return dayMap[r.course_no] || detectBinsHeuristic(r.course_no);
}

async function loadWorkLog(siteCode, groupId, startStr, endStr){
  const { startISO, endISO } = jstRangeToUtcISO(startStr, endStr);
  let q = `site_code=eq.${encodeURIComponent(siteCode)}&start_at=gte.${encodeURIComponent(startISO)}&start_at=lte.${encodeURIComponent(endISO)}&order=start_at.asc`;
  if(groupId && groupId !== '__all__') q += `&group_id=eq.${encodeURIComponent(groupId)}`;
  const rows = await sbSelect('work_log', q);
  return rows;
}

function emptyBinStat(){ return {storeKeys:new Set(), count:0, seconds:0}; }
function finalizeBinStat(s){
  const minutes = s.seconds/60;
  const productivity = minutes>0 ? Math.round(s.count*60/minutes) : 0;
  return { stores: s.storeKeys.size, count: s.count, minutes: Math.round(minutes*10)/10, productivity };
}

async function render(){
  const siteCode = $('siteSelect').value;
  const groupId = $('groupSelect').value;
  const startStr = $('startDateInput').value;
  const endStr = $('endDateInput').value;
  if(!siteCode || !startStr || !endStr){ return; }
  if(startStr > endStr){
    $('resultBody').innerHTML = '<tr><td colspan="13" class="empty-msg" style="color:var(--red);">⚠ 開始日が終了日より後になっています</td></tr>';
    return;
  }
  localSet('report_site_code', siteCode);
  localSet('report_group_id_'+siteCode, groupId);
  updatePeriodLabel(startStr, endStr);
  updatePresetHighlight(startStr, endStr);

  $('resultBody').innerHTML = '<tr><td colspan="13" class="empty-msg">読み込み中…</td></tr>';
  $('summaryBar').innerHTML = '';

  const [binMap, logRows] = await Promise.all([
    loadCourseBinMap(siteCode),
    loadWorkLog(siteCode, groupId, startStr, endStr)
  ]);
  lastGroupBinMap = binMap;

  if(logRows === null){
    $('resultBody').innerHTML = '<tr><td colspan="13" class="empty-msg" style="color:var(--red);">⚠ 通信エラーでデータを取得できませんでした。もう一度お試しください。</td></tr>';
    return;
  }
  if(logRows.length === 0){
    $('resultBody').innerHTML = '<tr><td colspan="13" class="empty-msg">この期間の実績データがありません</td></tr>';
    rawLogsByWorker = {};
    return;
  }

  rawLogsByWorker = {};
  logRows.forEach(r=>{
    if(!rawLogsByWorker[r.worker_no]) rawLogsByWorker[r.worker_no] = [];
    rawLogsByWorker[r.worker_no].push(r);
  });

  const validRows = logRows.filter(r => !r.cancelled);
  const byWorker = {};
  validRows.forEach(r=>{
    const no = r.worker_no;
    if(!byWorker[no]) byWorker[no] = { no, name: r.worker_name, bin1: emptyBinStat(), bin2: emptyBinStat() };
    const bin = getBinForRow(r, binMap);
    const target = bin === 2 ? byWorker[no].bin2 : byWorker[no].bin1;
    target.storeKeys.add(r.course_no + '-' + r.store_no);
    target.count += r.count;
    target.seconds += r.duration_sec;
  });

  const people = Object.values(byWorker).map(w=>{
    const bin1 = finalizeBinStat(w.bin1);
    const bin2 = finalizeBinStat(w.bin2);
    const totalSeconds = w.bin1.seconds + w.bin2.seconds;
    const totalCount = w.bin1.count + w.bin2.count;
    const totalStores = w.bin1.storeKeys.size + w.bin2.storeKeys.size;
    const totalMinutes = Math.round((totalSeconds/60)*10)/10;
    const totalProd = totalMinutes>0 ? Math.round(totalCount*60/totalMinutes) : 0;
    return {
      no: w.no, name: w.name,
      bin1, bin2,
      total: { stores: totalStores, count: totalCount, minutes: totalMinutes, productivity: totalProd }
    };
  });

  sortPeople(people);
  lastPeople = people;
  renderSummary(people);
  renderTable(people);
  updatePrintHeading();
}

function periodDisplayText(startStr, endStr){
  if(startStr === endStr){
    return `${startStr}（${weekdayJaOf(startStr)}）`;
  }
  return `${startStr}（${weekdayJaOf(startStr)}） 〜 ${endStr}（${weekdayJaOf(endStr)}）`;
}
function updatePrintHeading(){
  const siteCode = $('siteSelect').value;
  const groupSel = $('groupSelect');
  const groupName = groupSel.options[groupSel.selectedIndex] ? groupSel.options[groupSel.selectedIndex].textContent : '';
  const startStr = $('startDateInput').value;
  const endStr = $('endDateInput').value;
  $('printHeading').innerHTML = `
    <h2>個人別集計 ｜ ${esc(siteCode)} ・ ${esc(groupName)}</h2>
    <div class="meta">対象期間：${esc(periodDisplayText(startStr, endStr))}</div>
  `;
}
function updatePeriodLabel(startStr, endStr){
  $('periodLabel').textContent = periodDisplayText(startStr, endStr);
}
function updatePresetHighlight(startStr, endStr){
  const presetNames = ['today','yesterday','thisWeek','lastWeek','thisMonth','lastMonth','thisYear','lastYear'];
  let matched = null;
  for(const name of presetNames){
    const r = computePresetRange(name);
    if(partsToStr(r.start) === startStr && partsToStr(r.end) === endStr){ matched = name; break; }
  }
  document.querySelectorAll('.preset-btn').forEach(b=>{
    b.classList.toggle('active', b.getAttribute('data-preset') === matched);
  });
}
$('printBtn').addEventListener('click', ()=> window.print());
$('csvBtn').addEventListener('click', ()=>{
  if(lastPeople.length === 0){ alert('ダウンロードできるデータがありません'); return; }
  const siteCode = $('siteSelect').value;
  const startStr = $('startDateInput').value;
  const endStr = $('endDateInput').value;
  const periodTag = startStr === endStr ? startStr : `${startStr}_${endStr}`;
  const header = ['担当者№','氏名','1便_店舗数','1便_数量','1便_作業時間分','1便_生産性','2便_店舗数','2便_数量','2便_作業時間分','2便_生産性','合計_店舗数','合計_数量','合計_作業時間分','合計_生産性'];
  const rows = lastPeople.map(p=>[
    p.no, p.name,
    p.bin1.stores, p.bin1.count, p.bin1.minutes, p.bin1.productivity,
    p.bin2.stores, p.bin2.count, p.bin2.minutes, p.bin2.productivity,
    p.total.stores, p.total.count, p.total.minutes, p.total.productivity
  ]);
  const csv = [header, ...rows].map(row => row.map(v=>`"${String(v).replace(/"/g,'""')}"`).join(',')).join('\r\n');
  const blob = new Blob(['\uFEFF'+csv], {type:'text/csv;charset=utf-8;'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = `個人別集計_${siteCode}_${periodTag}.csv`;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  URL.revokeObjectURL(url);
});

function sortPeople(people){
  const keyMap = { productivity:'productivity', count:'count', stores:'stores', minutes:'minutes' };
  const k = keyMap[sortKey] || 'productivity';
  people.sort((a,b)=> b.total[k] - a.total[k]);
}

function renderSummary(people){
  const totalCount = people.reduce((s,p)=>s+p.total.count,0);
  const totalStores = people.reduce((s,p)=>s+p.total.stores,0);
  const avgProd = people.length ? Math.round(people.reduce((s,p)=>s+p.total.productivity,0)/people.length) : 0;
  $('summaryBar').innerHTML = `
    <div class="summary-stat"><div class="n">${people.length}</div><div class="l">人数</div></div>
    <div class="summary-stat"><div class="n">${totalStores}</div><div class="l">総店舗数</div></div>
    <div class="summary-stat"><div class="n">${totalCount}</div><div class="l">総数量</div></div>
    <div class="summary-stat"><div class="n">${avgProd}</div><div class="l">平均生産性/h</div></div>
  `;
}

function renderTable(people){
  $('resultBody').innerHTML = people.map(p => {
    const isOpen = expandedPeople.has(String(p.no));
    const summaryRow = `
    <tr class="person-row${isOpen?' open':''}" data-no="${p.no}">
      <td class="name-col"><span class="arrow">${isOpen?'▼':'▶'}</span> ${esc(p.name)}<span style="color:var(--muted);font-size:11px;"> (№${p.no})</span></td>
      <td>${p.bin1.stores}</td><td>${p.bin1.count}</td><td>${p.bin1.minutes}</td><td>${p.bin1.productivity}</td>
      <td class="group-sep">${p.bin2.stores}</td><td>${p.bin2.count}</td><td>${p.bin2.minutes}</td><td>${p.bin2.productivity}</td>
      <td class="group-sep total-col">${p.total.stores}</td><td class="total-col">${p.total.count}</td><td class="total-col">${p.total.minutes}</td><td class="total-col total-prod">${p.total.productivity}</td>
    </tr>`;
    const detailRow = isOpen ? `
    <tr class="detail-row" data-no="${p.no}">
      <td colspan="13">${renderPersonDetail(p.no)}</td>
    </tr>` : '';
    return summaryRow + detailRow;
  }).join('');

  $('resultBody').querySelectorAll('.person-row').forEach(tr=>{
    tr.addEventListener('click', ()=>{
      const no = tr.getAttribute('data-no');
      if(expandedPeople.has(no)) expandedPeople.delete(no); else expandedPeople.add(no);
      render();
    });
  });
  wireDetailHandlers();
}

function renderPersonDetail(no){
  const rows = (rawLogsByWorker[no] || []).slice().sort((a,b)=> new Date(a.start_at)-new Date(b.start_at));
  if(rows.length === 0) return '<div class="empty-msg">データがありません</div>';
  const isMultiDay = $('startDateInput').value !== $('endDateInput').value;
  const dateTh = isMultiDay ? '<th>日付</th>' : '';
  const dateTd = r => isMultiDay ? `<td>${fmtDateShortJst(r.start_at)}</td>` : '';
  const body = rows.map(r=>{
    const bin = getBinForRow(r, lastGroupBinMap);
    if(String(r.id) === String(editingRawId)){
      return `
      <tr class="raw-row editing" data-id="${r.id}">
        ${dateTd(r)}
        <td>${esc(r.course_name)}</td><td>${r.store_no}</td><td>${bin}便</td>
        <td><input type="number" class="edit-count" value="${r.count}"></td>
        <td colspan="2"><input type="datetime-local" class="edit-start" value="${toLocalInput(r.start_at)}"></td>
        <td colspan="2"><input type="datetime-local" class="edit-end" value="${toLocalInput(r.end_at)}"></td>
        <td colspan="2">
          <button class="mini-btn" data-save="${r.id}">保存</button>
          <button class="del-btn" data-canceledit="${r.id}">キャンセル</button>
        </td>
      </tr>`;
    }
    return `
    <tr class="raw-row${r.cancelled?' cancelled':''}" data-id="${r.id}">
      ${dateTd(r)}
      <td>${esc(r.course_name)}</td><td>${r.store_no}</td><td>${bin}便</td>
      <td>${r.count}</td>
      <td colspan="2">${fmtTimeShort(r.start_at)}</td>
      <td colspan="2">${fmtTimeShort(r.end_at)}(${fmtDuration(r.duration_sec)})</td>
      <td>${r.cancelled ? '取消' : r.productivity}</td>
      <td>
        <button class="mini-btn" data-edit="${r.id}">編集</button>
        <button class="del-btn" data-del="${r.id}">削除</button>
      </td>
    </tr>`;
  }).join('');
  return `<table class="raw-table">
    <thead><tr>${dateTh}<th>コース</th><th>店№</th><th>便</th><th>個口数</th><th colspan="2">開始</th><th colspan="2">終了</th><th>生産性/h</th><th></th></tr></thead>
    <tbody>${body}</tbody>
  </table>`;
}

function wireDetailHandlers(){
  const body = $('resultBody');
  body.querySelectorAll('[data-edit]').forEach(btn=>{
    btn.addEventListener('click', (ev)=>{
      ev.stopPropagation();
      editingRawId = btn.getAttribute('data-edit');
      render();
    });
  });
  body.querySelectorAll('[data-canceledit]').forEach(btn=>{
    btn.addEventListener('click', (ev)=>{
      ev.stopPropagation();
      editingRawId = null;
      render();
    });
  });
  body.querySelectorAll('[data-save]').forEach(btn=>{
    btn.addEventListener('click', async (ev)=>{
      ev.stopPropagation();
      const id = btn.getAttribute('data-save');
      const tr = btn.closest('tr');
      const count = parseInt(tr.querySelector('.edit-count').value, 10);
      const startVal = tr.querySelector('.edit-start').value;
      const endVal = tr.querySelector('.edit-end').value;
      if(!Number.isInteger(count) || count < 0 || !startVal || !endVal){
        alert('入力内容を確認してください');
        return;
      }
      const startISO = new Date(startVal).toISOString();
      const endISO = new Date(endVal).toISOString();
      const durationSec = Math.max(0, Math.round((new Date(endISO) - new Date(startISO))/1000));
      if(durationSec === 0){
        alert('終了時刻は開始時刻より後にしてください');
        return;
      }
      const productivity = Math.round(count * 3600 / durationSec);
      const ok = await sbUpdate('work_log', `id=eq.${id}`, {
        count, start_at: startISO, end_at: endISO, duration_sec: durationSec, productivity
      });
      if(!ok){ alert('保存に失敗しました。もう一度お試しください。'); return; }
      editingRawId = null;
      await render();
    });
  });
  body.querySelectorAll('[data-del]').forEach(btn=>{
    btn.addEventListener('click', async (ev)=>{
      ev.stopPropagation();
      const id = btn.getAttribute('data-del');
      if(!confirm('このデータを削除します。よろしいですか？(元に戻せません)')) return;
      const ok = await sbDelete('work_log', `id=eq.${id}`);
      if(!ok){ alert('削除に失敗しました。もう一度お試しください。'); return; }
      await render();
    });
  });
}

function esc(s){ return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

$('siteSelect').addEventListener('change', async ()=>{ await loadGroupOptions(); render(); });
$('groupSelect').addEventListener('change', render);
$('startDateInput').addEventListener('change', render);
$('endDateInput').addEventListener('change', render);
$('periodPresets').addEventListener('click', (e)=>{
  const btn = e.target.closest('.preset-btn');
  if(!btn) return;
  const range = computePresetRange(btn.getAttribute('data-preset'));
  $('startDateInput').value = partsToStr(range.start);
  $('endDateInput').value = partsToStr(range.end);
  render();
});
$('sortRow').addEventListener('click', (e)=>{
  const btn = e.target.closest('.sort-btn');
  if(!btn) return;
  sortKey = btn.getAttribute('data-key');
  document.querySelectorAll('.sort-btn').forEach(b=>b.classList.toggle('active', b===btn));
  render();
});

(async function init(){
  const today = jstTodayParts();
  $('startDateInput').value = partsToStr(today);
  $('endDateInput').value = partsToStr(today);
  await loadSiteOptions();
  await loadGroupOptions();
  document.querySelector('.sort-btn[data-key="productivity"]').classList.add('active');
  await render();
})();
</script>
